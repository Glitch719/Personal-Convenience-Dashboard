<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Our styles now live in their own file. -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <button class="settings-btn" id="settings-btn">Settings</button>
  <div class="settings-panel" id="settings-panel" hidden>
    <h2>Widgets</h2>
    <div class="settings-list" id="settings-list"></div>
  </div>

  <div class="dashboard">

    <header class="greeting">
      <h1 id="greeting-text">Hello.</h1>
      <p id="greeting-sub">Loading your day...</p>
    </header>

    <!-- Today summary: reads snapshots from the other widgets. -->
    <section class="summary-card" id="summary" data-widget="summary" data-widget-label="Today">
      <div class="summary-header"><h2>Today</h2></div>
      <div class="summary-body" id="summary-body"></div>
    </section>

    <!-- Weather widget. JavaScript fills in the numbers. -->
    <section class="weather-card" id="weather" data-widget="weather" data-widget-label="Weather">
      <div class="weather-left">
        <div class="weather-city" id="weather-city"></div>
        <div class="weather-main">
          <span class="weather-temp" id="weather-temp">--&deg;</span>
          <span class="weather-cond" id="weather-cond">Loading weather...</span>
        </div>
      </div>
      <div class="weather-stats" id="weather-stats"></div>
    </section>

    <!-- Clock widget. Also filled in by JavaScript. -->
    <section class="clock-grid" id="clock-grid" data-widget="clock" data-widget-label="Clocks"></section>

    <!-- Tasks widget. -->
    <section class="tasks-card" id="tasks" data-widget="tasks" data-widget-label="Tasks">
      <div class="tasks-header">
        <h2>Tasks</h2>
        <span class="tasks-count" id="tasks-count"></span>
      </div>
      <div class="task-input-row">
        <input type="text" id="task-input" placeholder="Add a task and press Enter" />
        <button id="task-add">Add</button>
      </div>
      <ul class="task-list" id="task-list"></ul>
    </section>

    <!-- Reminders widget. -->
    <section class="reminders-card" id="reminders" data-widget="reminders" data-widget-label="Reminders">
      <h2>Reminders</h2>
      <div class="reminder-input-row">
        <input type="text" id="reminder-text" placeholder="Remind me to..." />
        <input type="datetime-local" id="reminder-time" />
        <button id="reminder-add">Add</button>
      </div>
      <ul class="reminder-list" id="reminder-list"></ul>
    </section>

    <!-- Grocery list widget. -->
    <section class="grocery-card" id="grocery" data-widget="grocery" data-widget-label="Grocery">
      <div class="grocery-header">
        <h2>Grocery</h2>
        <button id="grocery-clear" class="grocery-clear">Clear checked</button>
      </div>
      <div class="grocery-input-row">
        <input type="text" id="grocery-input" placeholder="Add an item and press Enter" />
        <button id="grocery-add">Add</button>
      </div>
      <ul class="grocery-list" id="grocery-list"></ul>
    </section>

    <!-- Focus timer widget. -->
    <section class="focus-card" id="focus" data-widget="focus" data-widget-label="Focus timer">
      <div class="focus-header"><h2>Focus</h2></div>
      <div class="focus-time" id="focus-time">25:00</div>
      <div class="focus-presets">
        <button data-focus-min="25" class="active">25 min</button>
        <button data-focus-min="15">15 min</button>
        <button data-focus-min="5">5 min</button>
      </div>
      <div class="focus-controls">
        <button id="focus-start" class="focus-primary">Start</button>
        <button id="focus-reset">Reset</button>
      </div>
    </section>

    <!-- Expense tracker widget. -->
    <section class="expense-card" id="expenses" data-widget="expenses" data-widget-label="Expenses">
      <div class="exp-header">
        <div class="exp-title-group">
          <h2>Expenses</h2>
          <div class="exp-month">
            <button id="exp-prev">Prev</button>
            <span id="exp-title">Month</span>
            <button id="exp-next">Next</button>
          </div>
        </div>
        <div class="exp-total-group">
          <span class="exp-total-label">Total</span>
          <span class="exp-total" id="exp-total">0.00</span>
        </div>
      </div>

      <div class="exp-input-row">
        <input type="number" id="exp-amount" placeholder="Amount" step="0.01" min="0" />
        <select id="exp-category"></select>
        <input type="date" id="exp-date" />
        <button id="exp-add">Add</button>
      </div>

      <div class="exp-chart" id="exp-chart"></div>
      <ul class="exp-list" id="exp-list"></ul>
    </section>

    <!-- Calendar widget. -->
    <section class="calendar-card" id="calendar" data-widget="calendar" data-widget-label="Calendar">
      <div class="cal-header">
        <h2 id="cal-title">Calendar</h2>
        <div class="cal-nav">
          <button id="cal-prev">Prev</button>
          <button id="cal-today">Today</button>
          <button id="cal-next">Next</button>
        </div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-panel" id="cal-panel"></div>
    </section>

    <!-- News widget. -->
    <section class="news-card" id="news" data-widget="news" data-widget-label="News">
      <div class="news-header"><h2>News</h2></div>
      <ul class="news-list" id="news-list"></ul>
    </section>

  </div>

  <!-- One entry point, loaded as a module so it can import the others. -->
  <!-- type="module" requires a server (Live Server), not a double-clicked file. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
